[project]
name = "auto3d-human"
version = "1.2.0"
description = "Automated Dual-View T-Pose Character Image-to-3D & UE5 High-Poly BPY Pipeline (.glb / .fbx / .obj)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = [".venv", "outputs", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --tb=short"
