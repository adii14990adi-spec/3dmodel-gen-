name: Deploy 3DModel View to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  build-pages:
    name: Build Static 3DModel View Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web_model_viewer/package-lock.json

      - name: Install & Build GitHub Pages 3D Model Viewer
        working-directory: web_model_viewer
        run: |
          npm ci
          npm run build

      - name: Verify GitHub Pages bundle & High-Poly Draco GLB catalog
        run: |
          test -f docs/index.html
          test -f docs/404.html
          test -f docs/.nojekyll
          test -f docs/draco/draco_decoder.wasm
          test -f docs/models/catalog.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          cat = json.loads(Path("docs/models/catalog.json").read_text(encoding="utf-8"))
          assert len(cat["models"]) >= 4
          for m in cat["models"]:
              p = Path("docs") / m["glb_url"].lstrip("./")
              assert p.is_file() and p.stat().st_size > 50_000, f"Missing {p}"
          html = Path("docs/index.html").read_text(encoding="utf-8")
          assert "./assets/" in html, "Expected relative asset paths for GitHub Pages subpath hosting"
          print(f"Verified {len(cat['models'])} GitHub Pages 3D models successfully.")
          PY

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
