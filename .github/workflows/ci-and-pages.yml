name: Forge3D CI & GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  cpp-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure & Build C++ Engine
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Run C++ GoogleTest Suite
        run: ctest --test-dir build --output-on-failure

  blender-integration:
    needs: cpp-engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version
      - name: Build C++ Job CLI
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target forge3d_job_cli -j
      - name: Run Real C++ -> Blender Health-Check Round Trip
        run: |
          ./build/forge3d_job_cli worker-check
          ./build/forge3d_job_cli submit-run contracts/examples/job_spec.valid.json
          ./build/forge3d_job_cli status health-check-001
          ./build/forge3d_job_cli logs health-check-001
      - name: Upload Blender Health-Check Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-health-check-artifacts
          path: workspace/jobs/health-check-001/

  web-viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-viewer/package-lock.json
      - name: Install & Build Web Viewer
        working-directory: web-viewer
        run: |
          npm ci
          npm run build
      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-viewer/dist

  deploy-pages:
    needs: [cpp-engine, web-viewer]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
