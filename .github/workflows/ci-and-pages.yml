name: Forge3D CI & GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  cpp-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure & Build C++ Engine
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Run C++ GoogleTest Suite
        run: ctest --test-dir build --output-on-failure

  web-viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-viewer/package-lock.json
      - name: Install & Build Web Viewer
        working-directory: web-viewer
        run: |
          npm ci
          npm run build
      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-viewer/dist

  deploy-pages:
    needs: [cpp-engine, web-viewer]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
