name: Auto3D-Human CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

  test:
    name: Unit & Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install headless OpenGL/EGL libraries for PyVista & Open3D
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libglib2.0-0 libgomp1 libsm6 libxext6 libxrender1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Run Pytest suite
        run: pytest -v --tb=short

      - name: Smoke-test CLI on sample T-pose asset
        run: |
          python cli.py --list-engines
          python cli.py -i assets/sample_input.jpg -o /tmp/ci_smoke/hero.glb --mc-resolution 96 --target-faces 8000 --json
          test -f /tmp/ci_smoke/hero.glb
          test -f /tmp/ci_smoke/hero.obj

  docker-build:
    name: Docker Build (CUDA 12.1 Runtime)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CUDA 12.1 Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: auto3d-human:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
